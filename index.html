<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily Hours · Elite Refractory</title>
  <meta name="theme-color" content="#ff6b35" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark"><span style="width:24px;height:24px;display:block"></span></div>
      <div>
        <h1>Daily Hours</h1>
        <p>Elite Refractory</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="lang-toggle">
      <button data-l="es">ES</button>
      <button data-l="en">EN</button>
    </div>
  </header>

  <main id="app"></main>

  <script src="./js/pdf-lib.min.js"></script>
  <script>
    // Insertar el ícono de flama dentro del logo
    document.querySelector('.brand .mark').innerHTML =
      '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2s4.5 3.6 4.5 8.2a4.5 4.5 0 0 1-9 0c0-1.1.3-2 .8-2.8C7.7 9.6 7 11.4 7 13.2a5 5 0 1 0 10 0C17 7.6 12 5.4 12 2Z" fill="#fff"/></svg>';
  </script>
  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator)
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  </script>
</body>
</html>
